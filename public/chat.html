<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<style>
  :root { --accent: #2f6f4f; --ink: #1c2420; --muted: #5d6862; --line: #e2e6e3; --paper: #ffffff; --soft: #f3f5f3; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--paper); display: flex; flex-direction: column; }
  header { background: var(--accent); color: #fff; padding: 16px 18px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 16px; margin: 0; flex: 1; font-weight: 600; }
  header button { all: unset; cursor: pointer; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; font-size: 20px; line-height: 1; }
  header button:hover, header button:focus-visible { background: rgba(255,255,255,.18); }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; overflow-wrap: anywhere; }
  .msg p { margin: 0 0 6px; } .msg p:last-child, .msg ul:last-child, .msg ol:last-child { margin-bottom: 0; }
  .msg ul, .msg ol { margin: 4px 0 6px; padding-left: 20px; }
  .msg pre { background: rgba(0,0,0,.06); padding: 8px; border-radius: 6px; overflow-x: auto; font-size: 13px; }
  .msg code { font-size: 13px; }
  .msg a { color: inherit; }
  .visitor { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .bot, .admin { align-self: flex-start; background: var(--soft); border-bottom-left-radius: 4px; }
  .who { font-size: 12px; color: var(--muted); margin: 4px 0 -6px 4px; }
  .sources { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .sources a { color: var(--muted); }
  .starters { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .starters button { all: unset; cursor: pointer; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
  .starters button:hover, .starters button:focus-visible { border-color: var(--accent); color: var(--accent); }
  .typing { color: var(--muted); font-size: 13px; padding-left: 4px; }
  form.email { background: var(--soft); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  form.email label { font-size: 13.5px; }
  form.email div { display: flex; gap: 6px; }
  input, textarea { font: inherit; color: inherit; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background: #fff; min-width: 0; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .send { border: 0; background: var(--accent); color: #fff; border-radius: 10px; padding: 0 14px; font: inherit; font-weight: 600; cursor: pointer; }
  .send:disabled { opacity: .5; cursor: default; }
  footer { border-top: 1px solid var(--line); padding: 10px 12px 6px; }
  #compose { display: flex; gap: 8px; }
  #compose textarea { flex: 1; resize: none; height: 42px; max-height: 120px; }
  .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding: 6px 2px 0; }
  .meta button { all: unset; cursor: pointer; text-decoration: underline; }
  .meta a { color: var(--muted); text-decoration: none; } .meta a:hover { text-decoration: underline; }
  .error { color: #a33; font-size: 13px; padding: 0 4px; }
</style>
</head>
<body>
  <header><h1 id="title">Support</h1><button id="close" aria-label="Close chat">×</button></header>
  <main id="log" aria-live="polite"></main>
  <footer>
    <form id="compose">
      <textarea id="text" rows="1" placeholder="Write a message…" aria-label="Message" maxlength="4000"></textarea>
      <button class="send" id="send" type="submit">Send</button>
    </form>
    <div class="meta">
      <button id="human" type="button">Talk to a person</button>
      <a href="https://pandadesk.app/?ref=lite" target="_blank" rel="noopener">Powered by PandaDesk</a>
    </div>
  </footer>
<script src="/md.js"></script>
<script src="/chat.js"></script>
</body>
</html>
