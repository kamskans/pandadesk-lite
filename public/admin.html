<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Support admin</title>
<style>
  :root { --accent: #2f6f4f; --ink: #1c2420; --muted: #5d6862; --line: #dfe4e0; --paper: #fbfcfb; --card: #ffffff; --soft: #f1f4f2; --warn: #9a5b00; --bad: #a33a3a; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14.5px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--paper); }
  a { color: var(--accent); }
  button, input, textarea, select { font: inherit; color: inherit; }
  input, textarea, select { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #fff; width: 100%; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  textarea { resize: vertical; min-height: 80px; }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.danger { color: var(--bad); }
  .btn:disabled { opacity: .5; cursor: default; }
  .layout { display: grid; grid-template-columns: 200px 1fr; min-height: 100vh; }
  nav { border-right: 1px solid var(--line); padding: 20px 12px; display: flex; flex-direction: column; gap: 2px; background: var(--card); }
  nav .brand { font-weight: 700; padding: 0 10px 16px; }
  nav a { text-decoration: none; color: var(--ink); padding: 7px 10px; border-radius: 7px; display: flex; justify-content: space-between; }
  nav a.on { background: var(--soft); font-weight: 600; }
  nav .count { background: var(--accent); color: #fff; border-radius: 999px; font-size: 12px; padding: 0 7px; }
  nav .foot { margin-top: auto; font-size: 12.5px; color: var(--muted); padding: 10px; }
  nav .foot a { display: inline; padding: 0; color: var(--accent); text-decoration: underline; }
  main { padding: 28px 32px; max-width: 1100px; width: 100%; }
  h1 { font-size: 22px; margin: 0 0 18px; }
  h2 { font-size: 16px; margin: 28px 0 10px; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  label { font-weight: 600; font-size: 13.5px; display: block; margin-bottom: 4px; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 3px; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--soft); }
  .tag.waiting { background: #fdf0d9; color: var(--warn); } .tag.open { background: #e2f0e8; color: var(--accent); } .tag.error { background: #f8e3e3; color: var(--bad); }
  .inbox { display: grid; grid-template-columns: 320px 1fr; gap: 16px; height: calc(100vh - 110px); }
  .list { overflow-y: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  .list a { display: block; padding: 11px 14px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
  .list a.on { background: var(--soft); }
  .list .who { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
  .list .last { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thread { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; background: var(--card); min-height: 0; }
  .thread .top { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .m { max-width: 80%; padding: 8px 12px; border-radius: 12px; background: var(--soft); overflow-wrap: anywhere; }
  .m p { margin: 0 0 6px; } .m p:last-child { margin: 0; }
  .m.admin { align-self: flex-end; background: var(--accent); color: #fff; } .m.admin a { color: #fff; }
  .m.note { align-self: flex-end; background: #fff7df; border: 1px dashed #e3c56b; }
  .m.visitor { background: #fff; border: 1px solid var(--line); }
  .m .by { font-size: 11.5px; opacity: .75; margin-bottom: 2px; }
  .reply { border-top: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tabs a { text-decoration: none; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); font-size: 13.5px; }
  .tabs a.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  pre.snippet { background: var(--ink); color: #e8efe9; padding: 14px; border-radius: 10px; overflow-x: auto; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .login { max-width: 360px; margin: 14vh auto; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 8px; }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; } nav { flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); padding: 10px; }
    nav .brand, nav .foot { display: none; } main { padding: 18px 16px; }
    .inbox { grid-template-columns: 1fr; height: auto; } .grid2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="/md.js"></script>
<script src="/admin.js"></script>
</body>
</html>
